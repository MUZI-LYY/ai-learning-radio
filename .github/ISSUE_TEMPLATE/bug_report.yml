name: Bug 报告
description: 报告可复现的功能错误
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。安全漏洞请使用 Security 页面的私密报告，不要填写本表。
  - type: checkboxes
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现重复问题。
          required: true
        - label: 本报告不含密钥、私人资料、数据库内容或其他敏感信息。
          required: true
  - type: input
    attributes:
      label: 版本或提交
      placeholder: main / commit SHA / release
    validations:
      required: true
  - type: dropdown
    attributes:
      label: 组件
      options:
        - Frontend
        - Backend API
        - Worker / generation
        - LLM / TTS Provider
        - Documentation / setup
        - Other
    validations:
      required: true
  - type: textarea
    attributes:
      label: 问题描述
      description: 说明实际发生了什么，以及你期望的行为。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      description: 请使用 mock Provider 和虚构数据提供最小复现。
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    attributes:
      label: 环境与日志
      description: 可提供操作系统、Python/Node 版本和已脱敏日志；不要粘贴 .env。
